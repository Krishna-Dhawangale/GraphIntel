name: GraphIntel CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOCKER_REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  # -------------------------------------------------------------
  # 1. Backend Lint & Type Checking
  # -------------------------------------------------------------
  backend-lint-and-typecheck:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install ruff mypy -r requirements.txt

      - name: Run Ruff Linter
        run: |
          cd backend
          ruff check .

  # -------------------------------------------------------------
  # 2. Frontend Lint & Type Checking
  # -------------------------------------------------------------
  frontend-lint-and-typecheck:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Next.js Type Check & Build Validation
        run: |
          cd frontend
          npm run build

  # -------------------------------------------------------------
  # 3. Backend Unit, Integration & Security Tests
  # -------------------------------------------------------------
  backend-tests:
    name: Backend Unit, Integration & Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx prometheus-client locust -r requirements.txt

      - name: Run Pytest Suite
        run: |
          cd backend
          python -m pytest --maxfail=1

  # -------------------------------------------------------------
  # 4. Security Vulnerability Scan
  # -------------------------------------------------------------
  security-audit:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python Dependency Audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r backend/requirements.txt || true

  # -------------------------------------------------------------
  # 5. Build & Push Production Docker Images
  # -------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Images
    needs: [backend-lint-and-typecheck, frontend-lint-and-typecheck, backend-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend API Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/backend:${{ github.sha }},${{ env.DOCKER_REGISTRY }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Ingestion Worker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/worker:${{ github.sha }},${{ env.DOCKER_REGISTRY }}/worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/frontend:${{ github.sha }},${{ env.DOCKER_REGISTRY }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # 6. Continuous Deployment
  # -------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging Cluster
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Trigger Staging Helm / ArgoCD Sync
        run: |
          echo "Syncing Staging environment with commit ${{ github.sha }}..."

  deploy-production:
    name: Deploy to Production Cluster
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Trigger Production Helm / ArgoCD Sync
        run: |
          echo "Deploying production release with commit ${{ github.sha }}..."
