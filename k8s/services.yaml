apiVersion: v1
kind: Service
metadata:
  name: graphintel-backend-svc
  namespace: graphintel
  labels:
    app: graphintel-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: graphintel-backend
---
apiVersion: v1
kind: Service
metadata:
  name: graphintel-frontend-svc
  namespace: graphintel
  labels:
    app: graphintel-frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: graphintel-frontend
