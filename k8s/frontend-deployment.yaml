apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphintel-frontend
  namespace: graphintel
  labels:
    app: graphintel-frontend
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: graphintel-frontend
  template:
    metadata:
      labels:
        app: graphintel-frontend
        tier: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: frontend
          image: graphintel/frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              value: "/api/v1"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
