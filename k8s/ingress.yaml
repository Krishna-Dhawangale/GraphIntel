apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: graphintel-ingress
  namespace: graphintel
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - graphintel.example.com
      secretName: graphintel-tls-cert
  rules:
    - host: graphintel.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: graphintel-backend-svc
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: graphintel-frontend-svc
                port:
                  number: 3000
