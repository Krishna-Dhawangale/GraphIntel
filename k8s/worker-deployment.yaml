apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphintel-worker
  namespace: graphintel
  labels:
    app: graphintel-worker
    tier: background-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: graphintel-worker
  template:
    metadata:
      labels:
        app: graphintel-worker
        tier: background-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: worker
          image: graphintel/worker:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: graphintel-config
            - secretRef:
                name: graphintel-secrets
          resources:
            requests:
              cpu: "1000m"
              memory: "1024Mi"
            limits:
              cpu: "4000m"
              memory: "4096Mi"
