databases:
  - name: graphintel-db
    databaseName: graphintel
    user: graphintel
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: graphintel-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: graphintel-db
          property: connectionString
      - key: ASYNC_DATABASE_URL
        fromDatabase:
          name: graphintel-db
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: '["https://your-vercel-project.vercel.app"]'
      - key: ALLOWED_HOSTS
        value: '["graphintel-api.onrender.com"]'
      - key: FRONTEND_URL
        value: https://your-vercel-project.vercel.app
      - key: STORAGE_PROVIDER
        value: local
      - key: VECTOR_STORE_PROVIDER
        value: memory
      - key: GRAPH_STORE_PROVIDER
        value: memory
      - key: LLM_PROVIDER
        value: mock
      - key: RERANKER_PROVIDER
        value: simple
